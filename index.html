<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>مغامرة القرارات الذكية</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;color:#34405b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 15%,#ffd5e8,transparent 38%),radial-gradient(circle at 95% 80%,#c7f5e6,transparent 45%),linear-gradient(140deg,#fff8e9,#f0e6ff);padding:22px 14px 60px}.wrap{max-width:650px;margin:auto}.header{text-align:center}.tag{display:inline-block;background:#fff;padding:10px 22px;border-radius:40px;box-shadow:0 6px 20px #a68cb433;font-weight:700}.header h1{color:#8655b6;font-size:clamp(30px,7vw,47px);margin:20px 0 8px}.header p{margin:6px 0;font-size:17px}.name{font-weight:800;color:#ae588d}.card{margin-top:25px;background:#ffffffed;border:3px solid #fff;border-radius:30px;padding:22px;box-shadow:0 16px 38px #977cbb2b}.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.pill{background:#f2e9ff;border-radius:20px;padding:10px 14px;font-weight:800}.score{background:#fff0b5}.progress{height:12px;background:#f1e9f5;border-radius:30px;margin:24px 0;overflow:hidden}.bar{height:100%;width:10%;background:linear-gradient(90deg,#f8a4c5,#a88ce9);transition:width .3s}.emoji{text-align:center;font-size:55px;margin:10px 0}h2{text-align:center;font-size:23px;line-height:1.65;margin:12px 0 24px}.choices{display:grid;gap:12px}.choice{display:block;width:100%;text-align:right;font:inherit;font-size:17px;font-weight:650;padding:17px;border:2px solid #e4d7f4;border-radius:18px;background:#faf6ff;color:#34405b;cursor:pointer;touch-action:manipulation}.choice:active{transform:scale(.99)}.choice.correct{background:#d8f9e4;border-color:#3db67a}.choice.wrong{background:#ffe0e5;border-color:#e16b80}.choice:disabled{opacity:1;cursor:default}.feedback{text-align:center;min-height:58px;font-size:18px;font-weight:800;margin-top:20px}.next{width:100%;background:#8655b6;color:white;border:0;border-radius:16px;padding:15px;font:inherit;font-weight:800;font-size:18px;cursor:pointer}.next[hidden]{display:none}.foot{text-align:center;margin:22px auto;font-weight:700}.sound{border:0;background:transparent;font-size:23px;cursor:pointer}.finish{text-align:center}.finish h2{font-size:31px;color:#8655b6}.finish p{font-size:20px;line-height:1.8}.hidden{display:none}.stars{font-size:50px}
</style></head><body><main class="wrap"><header class="header"><div class="tag">🌷 نشاط تفاعلي للصف السادس 🌷</div><h1>🎮 مغامرة القرارات الذكية</h1><p>فكّري بذكاء، واختاري بحكمة، واجمعي النجوم! ✨</p></header><section class="card" id="game"><div class="stats"><span class="pill" id="counter">السؤال ١ من ١٠</span><span class="pill score" id="score">⭐ ٠ نقاط</span><button class="sound" id="sound" type="button" aria-label="تبديل الصوت">🔊</button></div><div class="progress"><div class="bar" id="bar"></div></div><div class="emoji" id="emoji">🌈</div><h2 id="question">جارٍ تحميل السؤال...</h2><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><button type="button" class="next" id="next" hidden>السؤال التالي ←</button></section><section class="card finish hidden" id="finish"><div class="stars">🏆🌟🎉</div><h2>أحسنتِ يا بطلة القرارات!</h2><p id="result"></p><button type="button" class="next" id="restart">🔄 العبي مرة ثانية</button></section><div class="foot">💗 كل قرار واعٍ خطوة نحو شخصية أقوى ومستقبل أجمل 💗</div></main><script>
'use strict';
const questions=[
{e:'📚',q:'لديكِ واجب وغدًا اختبار، وصديقتك تدعوكِ للعب، ماذا تفعلين؟',a:['ألعب طوال الوقت وأترك الواجب','أنظّم وقتي وأنهي واجبي ثم ألعب','أنسخ الواجب من صديقتي'],c:1,why:'تنظيم الوقت يساعدك على النجاح والراحة.'},
{e:'💬',q:'اختلفتِ مع زميلتكِ في رأي أثناء العمل الجماعي، ما القرار الأفضل؟',a:['أستمع لرأيها وأناقشها باحترام','أرفع صوتي حتى توافقني','أتوقف عن المشاركة'],c:0,why:'الاحترام والحوار يساعدان على الوصول لحل مناسب.'},
{e:'🧩',q:'واجهتكِ مسألة صعبة، ماذا تفعلين أولًا؟',a:['أستسلم فورًا','أختار إجابة عشوائية','أفهم المشكلة وأجرّب أكثر من حل'],c:2,why:'التفكير في الخيارات خطوة مهمة لحل المشكلات.'},
{e:'📱',q:'وصلتكِ رسالة تطلب معلوماتك الشخصية من شخص مجهول، ماذا تختارين؟',a:['أرسل المعلومات بسرعة','لا أشارك معلوماتي وأخبر شخصًا بالغًا موثوقًا','أرسلها لصديقاتي ليجربن'],c:1,why:'حماية المعلومات الشخصية قرار آمن ومسؤول.'},
{e:'🌱',q:'تريدين تعلم مهارة جديدة، ما الخطوة الذكية؟',a:['أضع هدفًا صغيرًا وأتدرب بانتظام','أنتظر حتى أتقنها دون تدريب','أتوقف عند أول خطأ'],c:0,why:'الخطوات الصغيرة والممارسة تصنع التقدم.'},
{e:'🤝',q:'رأيتِ طالبة تجلس وحدها في الفسحة، ما التصرف المناسب؟',a:['أتجاهلها دائمًا','أضحك عليها مع الآخرين','أدعوها بلطف للمشاركة معنا'],c:2,why:'التعاطف والمبادرة الطيبة يقويان العلاقات.'},
{e:'⏰',q:'عندكِ مهام كثيرة، كيف تختارين من أين تبدئين؟',a:['أبدأ بالمهم والعاجل وفق خطة','أؤجل كل شيء','أعمل دون ترتيب حتى أتعب'],c:0,why:'تحديد الأولويات يجعل إدارة الوقت أسهل.'},
{e:'🔎',q:'سمعتِ معلومة غريبة على الإنترنت، ماذا تفعلين قبل نشرها؟',a:['أنشرها فورًا','أتحقق من صحتها من مصدر موثوق','أصدقها لأنها منتشرة'],c:1,why:'التحقق من المعلومات جزء من التفكير الناقد.'},
{e:'🎨',q:'لم تنجح فكرتكِ في المشروع من أول مرة، ماذا تقررين؟',a:['ألوم الجميع','أترك المشروع بلا محاولة','أراجع الأخطاء وأحسن الفكرة'],c:2,why:'التعلم من الخطأ يساعد على التطور.'},
{e:'⭐',q:'قبل اتخاذ قرار مهم، ما الخطوات الأفضل؟',a:['أفكر في الخيارات والنتائج ثم أختار الأنسب','أقلد أي شخص دون تفكير','أقرر بسرعة دون معرفة النتائج'],c:0,why:'القرار الواعي يبدأ بفهم الخيارات ونتائجها.'}
];
const el=id=>document.getElementById(id);let index=0,points=0,answered=false,soundOn=true,ctx=null,timer=null;
function play(good){if(!soundOn)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!ctx)ctx=new AC();ctx.resume();const notes=good?[523,659,784]:[320,240];notes.forEach((hz,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=good?'sine':'triangle';o.frequency.value=hz;g.gain.setValueAtTime(.0001,ctx.currentTime+i*.13);g.gain.exponentialRampToValueAtTime(.14,ctx.currentTime+i*.13+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+i*.13+.17);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+i*.13);o.stop(ctx.currentTime+i*.13+.19)})}catch(e){}}
function render(){answered=false;clearTimeout(timer);const x=questions[index];el('counter').textContent=`السؤال ${index+1} من ${questions.length}`;el('score').textContent=`⭐ ${points} نقاط`;el('bar').style.width=((index+1)/questions.length*100)+'%';el('emoji').textContent=x.e;el('question').textContent=x.q;el('feedback').textContent='';el('next').hidden=true;const root=el('choices');root.replaceChildren();x.a.forEach((answer,i)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=answer;b.addEventListener('click',()=>choose(i));root.appendChild(b)})}
function choose(i){if(answered)return;answered=true;const x=questions[index],good=i===x.c;const bs=[...el('choices').children];bs.forEach((b,j)=>{b.disabled=true;if(j===x.c)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});if(good)points++;el('score').textContent=`⭐ ${points} نقاط`;el('feedback').textContent=(good?'✅ إجابة صحيحة! ':'❌ إجابة غير صحيحة. ')+x.why;play(good);el('next').hidden=false;el('next').textContent=index===questions.length-1?'شاهدي النتيجة 🏆':'السؤال التالي ←';timer=setTimeout(advance,2600)}
function advance(){if(!answered)return;clearTimeout(timer);if(index===questions.length-1){el('game').classList.add('hidden');el('finish').classList.remove('hidden');el('result').textContent=`جمعتِ ${points} من ${questions.length} نجوم! ${points>=8?'أنتِ متميزة في اتخاذ القرارات! 🌟':'استمري في التعلم والمحاولة، كل تجربة تزيد خبرتك! 💕'}`}else{index++;render()}}
el('next').addEventListener('click',advance);el('restart').addEventListener('click',()=>{index=0;points=0;el('finish').classList.add('hidden');el('game').classList.remove('hidden');render()});el('sound').addEventListener('click',()=>{soundOn=!soundOn;el('sound').textContent=soundOn?'🔊':'🔇';if(soundOn)play(true)});render();
</script></body></html>
